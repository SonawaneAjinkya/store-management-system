<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Patil General Store</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">P</div><div><h2>Patil General Store</h2><small>SMART SHOP POS</small></div></div><nav class="nav"><a href="index.html"><span class="nav-icon">⌂</span>Dashboard</a><a href="sell.html"><span class="nav-icon">▣</span>New Sale</a><a href="products.html"><span class="nav-icon">◈</span>Products</a><a href="restock.html"><span class="nav-icon">↥</span>Restock</a><a href="customers.html"><span class="nav-icon">♙</span>Customers</a><a href="transactions.html"><span class="nav-icon">▤</span>Transactions</a><a class="active" href="settings.html"><span class="nav-icon">⚙</span>Settings</a></nav></aside>
<main class="main"><header class="topbar"><div><small class="label">CONFIGURATION</small><h1>Settings</h1></div><div class="connection"><span id="statusDot" class="dot"></span><span id="connectionText">Loading...</span></div></header>
<section class="hero"><div><div class="eyebrow">SHOP PROFILE</div><h2>Make it <span>yours.</span></h2><p>These settings flow into invoices, receipts and shop identity.</p></div></section>
<section class="card panel"><form id="f"><div class="form-grid"><div class="field"><label>Shop Name</label><input id="shopName"></div><div class="field"><label>Tagline</label><input id="tagline"></div><div class="field full"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email"></div><div class="field"><label>GSTIN</label><input id="gstin"></div><div class="field"><label>Currency Symbol</label><input id="currencySymbol"></div><div class="field"><label>Sales Invoice Prefix</label><input id="invoicePrefix"></div><div class="field"><label>Purchase Invoice Prefix</label><input id="purchaseInvoicePrefix"></div><div class="field full"><label>Receipt Footer</label><input id="receiptFooter"></div></div><div class="form-actions"><button class="btn primary">Save Settings</button></div></form></section><div class="footer">Shop configuration • Patil General Store</div></main></div><div id="toast" class="toast"></div>
<script src="../js/app.js"></script><script>
const fields=["shopName","tagline","address","phone","email","gstin","currencySymbol","invoicePrefix","purchaseInvoicePrefix","receiptFooter"];
async function load(){try{const s=await api("/settings");fields.forEach(k=>qs("#"+k).value=s[k]??"");setConnection(true)}catch(e){setConnection(false);toast(e.message,"error")}}
qs("#f").onsubmit=async e=>{e.preventDefault();const body={};fields.forEach(k=>body[k]=qs("#"+k).value.trim());try{await api("/settings",{method:"PUT",body:JSON.stringify(body)});toast("Settings saved ✓")}catch(err){toast(err.message,"error")}};load();
</script></body></html>
