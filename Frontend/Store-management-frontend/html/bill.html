<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice | Patil General Store</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="main"><div class="print-actions"><a class="btn" href="sell.html">← Back to POS</a><button class="btn primary" onclick="window.print()">Print Invoice</button></div><section class="card receipt"><div class="receipt-inner" id="receipt"><div class="empty">Loading invoice...</div></div></section><div class="footer">Patil General Store • Thank you for shopping with us!</div></main><div id="toast" class="toast"></div><script src="../js/app.js"></script><script>
const id=new URLSearchParams(location.search).get("id");
async function load(){if(!id)return qs("#receipt").innerHTML='<div class="empty">Invoice ID is missing.</div>';try{const [s,st]=await Promise.all([api("/sales/"+id),api("/settings")]);const items=s.items||[];qs("#receipt").innerHTML=`<div class="receipt-shop"><h1>${esc(st.shopName||"Patil General Store")}</h1><p>${esc(st.tagline||"")}<br>${esc(st.address||"")}<br>${esc(st.phone||"")} ${st.gstin?"• GSTIN: "+esc(st.gstin):""}</p></div><div class="receipt-meta"><div><strong>Invoice</strong><br>${esc(s.invoiceNumber)}</div><div><strong>Date</strong><br>${s.saleDate?new Date(s.saleDate).toLocaleString("en-IN"):"—"}</div><div><strong>Customer</strong><br>${esc(s.customerName||"Walk-in Customer")} ${s.customerPhone?"• "+esc(s.customerPhone):""}</div><div><strong>Payment</strong><br>${esc(s.paymentMethod||"—")}</div></div><div class="receipt-table"><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.product?.name||"Product")}</td><td>${num(i.quantity)}</td><td>${money(i.price)}</td><td class="money">${money(i.total)}</td></tr>`).join("")}</tbody></table></div><div class="receipt-total"><div class="sum-line"><span>Subtotal</span><strong>${money(s.subtotal)}</strong></div><div class="sum-line"><span>Discount</span><strong>${money(s.discount)}</strong></div><div class="sum-line"><span>GST</span><strong>${money(s.tax)}</strong></div><div class="sum-line total"><span>Total</span><strong>${money(s.totalAmount)}</strong></div><div class="sum-line"><span>Received</span><strong>${money(s.amountReceived)}</strong></div><div class="sum-line"><span>Change</span><strong>${money(s.changeAmount)}</strong></div><div class="sum-line"><span>Credit</span><strong>${money(s.creditAmount)}</strong></div></div><p style="text-align:center;color:var(--muted);font-size:11px;margin-top:28px">${esc(st.receiptFooter||"Thank you for shopping with us!")}</p>`}catch(e){qs("#receipt").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
load();
</script></body></html>
